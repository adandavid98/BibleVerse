name: Branch CI Check

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  check-build:
    name: Verify Compilation & Package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Build Android APK
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GEMINI_API_KEY=$(echo 'QVEuQWI4Uk42TFp2c0dZemRWOWVHV1Q3d0JMa0VSNDdLTTdWaDZJNEdndEhXX09BSmZPZVE=' | base64 -d)" > .env
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerse-feature-youversion-preview
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
