name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la versión (ej. v1.1)'
        required: false
        default: ''
      release_title:
        description: 'Título del lanzamiento'
        required: false
        default: 'Versículos Bíblicos - Nueva Actualización'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "VERSION_TAG=${TAG}" >> $GITHUB_ENV
          echo "Version Tag is ${TAG}"

      - name: Build Android APK
        run: |
          # Ensure a usable debug keystore exists as required by signingConfig 'debugConfig'
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Also ensure ~/.android/debug.keystore exists
          mkdir -p ~/.android
          cp -f debug.keystore ~/.android/debug.keystore 2>/dev/null || true

          # Find gradle executable (gradlew or installed gradle)
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          
          # Build APK (assembleDebug guarantees instant installability on any user phone without strict Play Store certificates)
          # Also attempts assembleRelease if keystore credentials are provided
          if [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            export STORE_PASSWORD="${{ secrets.STORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            $GRADLE_CMD assembleRelease --no-daemon
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "Building installable APK with debug signing for direct phone installation..."
            $GRADLE_CMD assembleDebug --no-daemon
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          echo "APK built at: $APK_PATH"
          mkdir -p build-artifacts
          OUTPUT_APK="build-artifacts/VersiculosBiblicos-${VERSION_TAG}.apk"
          cp "$APK_PATH" "$OUTPUT_APK"
          echo "FINAL_APK=$OUTPUT_APK" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ github.event.inputs.release_title || env.VERSION_TAG }}
          body: |
            ## 📖 Versículos Bíblicos - Actualización ${{ env.VERSION_TAG }}
            
            ¡Nueva versión disponible para instalar directamente en tu teléfono Android!
            
            ### 📥 Descarga directa del instalador:
            - Descarga el archivo **`VersiculosBiblicos-${{ env.VERSION_TAG }}.apk`** adjunto abajo.
            - También puedes actualizar automáticamente desde la aplicación en **Ajustes > Actualizaciones de la Aplicación**.
            
            ---
            *Compilado automáticamente mediante GitHub Actions.*
          files: |
            ${{ env.FINAL_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
