<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="50%" stop-color="#0F141C" />
      <stop offset="100%" stop-color="#1A273D" />
    </linearGradient>
    <radialGradient id="glow" cx="54" cy="54" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B869" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E5B869" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with rounded squircle for modern app icon -->
  <rect width="108" height="108" rx="24" fill="url(#bgGradient)" />

  <!-- Soft Golden Ambient Glow -->
  <circle cx="54" cy="54" r="38" fill="url(#glow)" />

  <!-- Bible Graphic with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Gold Cover / Edge Trim -->
    <path d="M28,69 C38,67 54,71 54,71 C54,71 70,67 80,69 L80,74 C70,72 54,76 54,76 C38,72 28,74 28,74 Z" fill="#E5B869" />

    <!-- Pages Base Lower -->
    <path d="M30,68 C40,66 54,70 54,70 C54,70 68,66 78,68 L78,72 C68,70 54,74 54,74 C40,70 30,72 30,72 Z" fill="#ECEFF1" />

    <!-- Open Bible Pages -->
    <path d="M30,36 C30,36 40,34 54,38 C68,34 78,36 78,36 L78,68 C78,68 68,66 54,70 C40,66 30,68 30,68 Z" fill="#F8F9FA" />

    <!-- Center Spine -->
    <path d="M53,38 L55,38 L55,70 L53,70 Z" fill="#CFD8DC" />

    <!-- Page Text Lines Left -->
    <g stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round">
      <line x1="35" y1="44" x2="49" y2="43" />
      <line x1="35" y1="49" x2="49" y2="48" />
      <line x1="35" y1="54" x2="49" y2="53" />
      <line x1="35" y1="59" x2="47" y2="58" />
    </g>

    <!-- Page Text Lines Right -->
    <g stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round">
      <line x1="59" y1="43" x2="73" y2="44" />
      <line x1="59" y1="48" x2="73" y2="49" />
      <line x1="59" y1="53" x2="73" y2="54" />
      <line x1="59" y1="58" x2="71" y2="59" />
    </g>

    <!-- Golden Ribbon Bookmark -->
    <path d="M51,37 L57,37 L57,64 L54,61 L51,64 Z" fill="#E5B869" />

    <!-- Radiant Cross at top -->
    <g stroke="#E5B869" stroke-width="2.6" stroke-linecap="round">
      <line x1="54" y1="23" x2="54" y2="34" />
      <line x1="48" y1="27" x2="60" y2="27" />
    </g>
  </g>
</svg>
